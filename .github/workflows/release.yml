name: Release

# A pushed tag builds the release on each platform and attaches the tarballs.
# An older tag gets its downloads from a manual run with its name.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to build, such as v0.1.0
        required: true

permissions:
  contents: write

env:
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  build:
    strategy:
      matrix:
        include:
          # The oldest supported Ubuntu keeps glibc and OpenSSL low so the tarball runs on most Linux hosts
          - os: ubuntu-22.04
            target: linux-x86_64
          - os: macos-latest
            target: macos-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: erlef/setup-beam@v1
        with:
          version-file: .tool-versions
          version-type: strict
      - run: mix deps.get --only prod
      - run: MIX_ENV=prod mix release keel --overwrite
      - name: Pack the release
        run: |
          name="keel-${TAG}-${{ matrix.target }}.tar.gz"
          tar -czf "$name" -C _build/prod/rel keel
          shasum -a 256 "$name" > "$name.sha256"
      - name: Check that the release starts a group and serves a write
        run: |
          mkdir try
          tar -xzf "keel-${TAG}-${{ matrix.target }}.tar.gz" -C try
          export RELEASE_NODE=keelcheck@127.0.0.1 RELEASE_DISTRIBUTION=name RELEASE_COOKIE=check
          export KEEL_MEMBER_ID=a KEEL_MEMBERS=a=keelcheck@127.0.0.1 KEEL_START=bootstrap
          export KEEL_CLUSTER_ID=$(openssl rand -hex 16) KEEL_DATA_DIR="$PWD/try/data"
          try/keel/bin/keel daemon
          sleep 5
          try/keel/bin/keel rpc '{:ok, _writer} = Keel.KV.start_writer(:default, nodes: [node()]); {:ok, _revision} = Keel.KV.put(:default, "k", "v"); {:ok, %{value: "v"}} = Keel.KV.get(:default, "k")'
          try/keel/bin/keel stop
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: keel-*.tar.gz*

  publish:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      # The notes are the newest section of the changelog without its heading
      - name: Take the notes from the changelog
        run: awk '/^## /{n++} n==1 && !/^## /' CHANGELOG.md | sed '/./,$!d' > notes.md
      - name: Attach the tarballs to the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if ! gh release view "$TAG" > /dev/null 2>&1; then
            gh release create "$TAG" --title "$TAG" --notes-file notes.md --verify-tag
          fi
          gh release upload "$TAG" keel-*.tar.gz* --clobber
